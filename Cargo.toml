[workspace]
members = ["crates/cli", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/deeplabua/oci-free-keeper"
homepage = "https://deeplab.tools"

# Every dependency here must be permissive (MIT/Apache-2.0/BSD/ISC/MPL/Zlib).
[workspace.dependencies]
oci-free-keeper-core = { version = "0.1.2", path = "crates/core" }
anyhow = "1.0"                                                   # MIT OR Apache-2.0
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }  # MIT OR Apache-2.0
# ~/.oci/config, request signing and the HTTP client, shared with oci-arm-catcher and
# oci-free-audit. 0.1.1+: on_domain() for the Organizations API (payment model).
oci-request-signer = "0.1.1"                                     # MIT
dirs = "6.0"                                                     # MIT OR Apache-2.0
serde = { version = "1.0", features = ["derive"] }               # MIT OR Apache-2.0
serde_json = "1.0"                                               # MIT OR Apache-2.0
# rustls + ring, no C toolchain and no OpenSSL; already in the graph through oci-request-signer.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }  # MIT OR Apache-2.0

[profile.release]
lto = "thin"
strip = true

# The profile dist builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "deeplabua/homebrew-tap"
# Publish jobs to run in CI. `./publish-crates` is the local reusable workflow
# `.github/workflows/publish-crates.yml` (crates.io; needs the CARGO_REGISTRY_TOKEN
# repo secret).
publish-jobs = ["homebrew", "./publish-crates"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"

# GitHub retired the macos-14 image dist 0.32 picks for Apple Silicon.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
